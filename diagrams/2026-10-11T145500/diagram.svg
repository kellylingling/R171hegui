<rect x="32" y="912" width="1376" height="85" rx="14" fill="white" stroke="#d5e0ed"/>
<text x="52" y="943" font-size="16" fill="#173e5e">法规要求：有效监测、事件通报、周期统计、软件与批准可追溯；设计整改材料经批准机关进入 DETA。</text>
<text x="52" y="978" font-size="16" fill="#a45b1b">工程选择：采样率、缓存时长、mTLS、消息队列、云地域与存储。R171 不统一要求全部原始数据实时直传监管云。</text>
