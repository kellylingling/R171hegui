<text x="72" y="258">DCAS、DMS 与 HMI</text><text x="72" y="416">隔离的法规数据采集器</text><text x="72" y="574">持久计数与事件缓存</text><text x="72" y="732">安全网关 / TCU</text>
<text x="494" y="258">设备接入、校验、去重与消息队列</text><text x="494" y="416">事故证据与调查</text><text x="750" y="416">指标与质量监测</text><text x="494" y="574">车辆配置台账、批准与安全论证</text><text x="494" y="732">合规报告、审签与监管出口</text>
<text x="1066" y="258">授予批准的型式批准机关</text><text x="1066" y="416">涉及 DCAS 设计整改时</text><text x="1066" y="732">其他适用 R171 的批准机关</text>
</g>
<g fill="#566d83" font-size="15">
<text x="72" y="287">感知规划控制、驾驶员告警与风险减缓</text><text x="72" y="312">驾驶安全闭环在车端完成</text>
<text x="72" y="445">功能模式、告警、退出、碰撞与动作</text><text x="72" y="470">里程时长、版本与时钟质量</text>
<text x="72" y="603">事件冻结、掉电恢复与独立告警窗口</text><text x="72" y="628">保留累计值、序号与重算线索</text>
<text x="72" y="761">设备身份、签名、加密与接收确认</text><text x="72" y="786">元数据优先、持久队列、断点续传</text>
<text x="494" y="287">包摘要、Schema、出处与时间一致性</text><text x="494" y="312">非法数据隔离、漏报告警，不静默记零</text>
<text x="494" y="445">不可变快照与审计</text><text x="494" y="470">首报、根因、整改</text>
<text x="750" y="445">Table 1 九项与暴露量</text><text x="750" y="470">失联覆盖率、版本分组</text>
<text x="494" y="603">批准号、法规版本、功能边界、R171SWIN</text><text x="494" y="628">实际软件 / 模型 / 标定关联试验与安全文件</text>
<text x="494" y="761">首报、调查、年报 / 特定月报、回执</text><text x="494" y="786">固定证据快照、可复算口径、分级留存</text>
<text x="1066" y="287">事故首报、调查、周期报与资料核查</text><text x="1066" y="312">具体交付通道与厂家商定</text>
<text x="1066" y="445">英文 PDF：事故、原因与整改</text><text x="1066" y="470">按批准号归档 OTHER 文档及 News</text>
<text x="1066" y="761">受控查阅整改材料与按需问询</text><text x="1066" y="786">不是车端实时遥测接收平台</text>
<text x="67" y="851">断网 / 损坏：授权本地导出并补充售后证据</text>
<text x="486" y="851">整改 → 验证 → 批准变更评估 → R156 更新发布</text>
